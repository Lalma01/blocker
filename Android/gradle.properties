org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Release signing (self-signed key committed for reproducible self-control builds).
# The store/key password and the key alias are literally "striparco" *inside* the
# .keystore file itself (from before the PS-BLOCK rebrand) — renaming them here would
# not change what's actually inside the keystore and would just break signing, so the
# property values are intentionally left as the original secret/alias. Only the on-disk
# filename and the property names were renamed to match the new product name.
PSBLOCK_STORE_FILE=psblock-release.keystore
PSBLOCK_STORE_PASSWORD=striparco
PSBLOCK_KEY_ALIAS=striparco
PSBLOCK_KEY_PASSWORD=striparco
